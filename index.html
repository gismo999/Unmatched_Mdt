<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHS ePCR System</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --text-color: #2d3436;
            --accent-blue: #0984e3;
            --accent-green: #00b894;
            --danger-red: #d63031;
            --hart-orange: #e17055;
            --radius: 25px;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-color); 
            margin: 0; padding: 20px; line-height: 1.5; 
        }

        .container { 
            max-width: 800px; margin: 0 auto; background: var(--glass-bg); 
            backdrop-filter: blur(15px); padding: 40px; border-radius: var(--radius); 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header-title-main { font-size: 1.8em; font-weight: 800; color: #1a1a1a; }

        .form-section { 
            background: rgba(255,255,255,0.5); padding: 25px; margin-bottom: 20px; 
            border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.4);
        }

        h2 { font-size: 1.2em; color: #1a1a1a; margin-top: 0; }

        input, select, textarea { 
            width: 100%; padding: 12px 18px; margin-top: 5px; border: 1px solid rgba(0,0,0,0.1);
            border-radius: 15px; background: rgba(255,255,255,0.6); font-size: 1em;
        }

        button { 
            padding: 12px 25px; border: none; border-radius: 15px; cursor: pointer;
            font-weight: 700; transition: transform 0.2s, background 0.2s; color: white;
        }

        button:hover { transform: translateY(-2px); }
        .primary-btn { background: var(--accent-blue); width: 100%; margin-top: 15px; }
        .success-btn { background: var(--accent-green); }
        .reset-btn { background: var(--danger-red); margin-top: 10px; }

        .meds-logger { display: none; padding: 20px; border: 2px dashed #aaa; border-radius: 20px; margin-top: 15px; }
        .med-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; }
        
        .logged-list { list-style: none; padding: 0; margin-top: 15px; }
        .logged-list li { background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        
        #hiddenFields, .hidden-detail-box, .hems-doc-only, .hart-only { display: none; }
        .rsi-box { border: 2px solid #ff7675; padding: 20px; border-radius: 20px; }
        .hart-box { border: 2px solid #fdcb6e; padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center;"><img src="uhs.png" alt="Logo" style="max-width: 200px;"></div>
    <div class="header"><div class="header-title-main">UHS ePCR System</div></div>
    
    <form id="epcrForm">
        <div class="form-section">
            <label>Select Medic Grade</label>
            <select id="grade" onchange="revealFormAndPopulateMeds()">
                <option value="" disabled selected>-- Choose Grade --</option>
                <option value="Student Paramedic">Student Paramedic</option>
                <option value="Paramedic">Paramedic</option>
                <option value="Advanced Paramedic">Advanced Paramedic</option>
                <option value="HEMS">HEMS</option>
                <option value="HART">HART</option>
                <option value="Junior Doctor">Junior Doctor</option>
                <option value="Doctor">Doctor</option>
            </select>
        </div>

        <div id="hiddenFields">
            <div class="form-section">
                <h2>Incident Details</h2>
                <div class="grid-2">
                    <div><label>Unit / Call Sign</label><input type="text" id="callsign"></div>
                    <div><label>Date & Time</label><input type="datetime-local" id="date"></div>
                </div>
                <div class="hems-doc-only" style="margin-top:15px;"><label>Deployment Method</label><select id="deployMethod"><option value="HEMS">HEMS</option><option value="RRV">RRV</option></select></div>
            </div>

            <div class="form-section">
                <h2>1. Injury Information</h2>
                <div class="hems-doc-only" style="margin-bottom:15px;"><label>Scene Findings</label><textarea id="sceneFindings"></textarea></div>
                <label>Primary Injury / Complaint</label><textarea id="injuryInfo"></textarea>
                <div class="grid-2" style="margin-top:15px;">
                    <div><label>X-Ray?</label><select id="xraySelect" onchange="toggleHiddenDiv('xraySelect', 'xrayDetails')"><option value="No">No</option><option value="Yes">Yes</option></select><div id="xrayDetails" class="hidden-detail-box"><label>Findings:</label><input type="text" id="xrayResults"></div></div>
                    <div><label>MRI?</label><select id="mriSelect" onchange="toggleHiddenDiv('mriSelect', 'mriDetails')"><option value="No">No</option><option value="Yes">Yes</option></select><div id="mriDetails" class="hidden-detail-box"><label>Findings:</label><input type="text" id="mriResults"></div></div>
                </div>
                <button type="button" class="primary-btn" onclick="copyInjuryMDT()">📋 Copy INJURY Section</button>
            </div>

            <div class="form-section">
                <h2>2. Treatment & Medications</h2>
                <label><input type="checkbox" id="medsToggle" onchange="toggleMedsUI()"> Medication Administered?</label>
                <div id="medsLoggerUI" class="meds-logger">
                    <div class="med-row">
                        <select id="medSelect"></select>
                        <input type="text" id="medDose" placeholder="Dose">
                        <input type="time" id="medTime">
                        <button type="button" class="success-btn" onclick="logMedication()">Add</button>
                    </div>
                    <ul id="loggedMedsList" class="logged-list"></ul>
                </div>
                <div class="hart-only hart-box">
                    <label>HART Equipment?</label><select id="hartEquipSelect" onchange="toggleHiddenDiv('hartEquipSelect', 'hartEquipDetails')"><option value="No">No</option><option value="Yes">Yes</option></select>
                    <div id="hartEquipDetails" class="hidden-detail-box"><select id="hartEquipDropdown"><option value="Tripod">Tripod</option><option value="Basket Stretcher">Basket Stretcher</option><option value="MTFA Gear">MTFA Gear</option><option value="CBRN Gear">CBRN Gear</option><option value="Diving Gear">Diving Gear</option></select><button type="button" class="primary-btn" onclick="logHart()">Add Gear</button><ul id="loggedHartList" class="logged-list"></ul></div>
                </div>
                <div class="hems-doc-only rsi-box">
                    <label>RSI Performed?</label><select id="rsiSelect" onchange="toggleHiddenDiv('rsiSelect', 'rsiDetails')"><option value="No">No</option><option value="Yes">Yes</option></select>
                    <div id="rsiDetails" class="hidden-detail-box"><div class="grid-2"><input type="text" id="rsiMeds" placeholder="Meds"><input type="time" id="rsiTime"></div></div>
                </div>
                <label>Treatment Notes</label><textarea id="treatmentNotes"></textarea>
                <button type="button" class="primary-btn success-btn" onclick="copyTreatmentMDT()">📋 Copy TREATMENT Section</button>
                <button type="button" class="primary-btn reset-btn" onclick="resetForm()">🔄 Reset Form</button>
            </div>
        </div>
    </form>
</div>

<script>
    const medMap = { "Student Paramedic": ["Oxygen (Cardiac arrest/trauma) (GAS)", "Aspirin (Heart attack) 300mg (TABLET)", "Codeine (Pain) 15mg (TABLET)", "Glucose (Hypoglycemia) 50g/500ml", "GTN (Angina) 400mcg/spray", "Ibuprofen (Pain) 400mg", "Ipratropium Bromide (Asthma) 250mcg/3ml", "Naproxen (Pain) 250mg", "Paracetamol (Pain) 1g", "Salbutamol (Asthma) 2.5mg/2.5ml"], "Paramedic": ["Adrenaline (Cardiac arrest) 1mg/10ml", "Amiodarone (Pulseless VT) 300mg/10ml", "Atropine Sulfate (Symptomatic <40 pulse) 600mcg", "Chlorphenamine (Allergic reaction) 10mg/1ml", "Metoclopramide (Nausea) 10mg/2ml", "Midazolam (Seizure) 5mg/5ml", "Morphine Sulfate (Pain) 10mg/1ml", "Naloxone (Overdose) 400mcg/1ml", "TXA (Trauma) 100mg/1ml"], "Advanced Paramedic": ["Ketamine (Severe pain) 10mg/1ml"], "HEMS": ["Amoxicillin (Infections) 500mg", "Rocuronium Bromide (RSI) 10mg/1ml"], "Doctor": ["Co-amoxiclav (Fractures) 1200mg", "Diazepam (Muscle spasms) 5mg"] };
    medMap["Advanced Paramedic"] = medMap["Paramedic"].concat(medMap["Advanced Paramedic"]); medMap["HEMS"] = medMap["Advanced Paramedic"].concat(medMap["HEMS"]); medMap["Doctor"] = medMap["HEMS"].concat(medMap["Doctor"]); medMap["HART"] = medMap["Paramedic"]; medMap["Junior Doctor"] = medMap["Doctor"];
    let meds = [], hart = [];

    function revealFormAndPopulateMeds() {
        const g = document.getElementById('grade').value;
        document.getElementById('hiddenFields').style.display = "block";
        const isHD = (g === "HEMS" || g === "Junior Doctor" || g === "Doctor");
        document.querySelectorAll('.hems-doc-only').forEach(el => el.style.display = isHD ? "block" : "none");
        document.querySelectorAll('.hart-only').forEach(el => el.style.display = (g === "HART") ? "block" : "none");
        const s = document.getElementById('medSelect'); s.innerHTML = "";
        medMap[g].sort().forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; s.appendChild(o); });
    }
    function toggleHiddenDiv(s, d) { document.getElementById(d).style.display = (document.getElementById(s).value === "Yes") ? "block" : "none"; }
    function toggleMedsUI() { document.getElementById('medsLoggerUI').style.display = document.getElementById('medsToggle').checked ? "block" : "none"; }
    function logMedication() { meds.push(`[${document.getElementById('medTime').value}] ${document.getElementById('medSelect').value} (${document.getElementById('medDose').value})`); render(); }
    function logHart() { hart.push(document.getElementById('hartEquipDropdown').value); render(); }
    function render() {
        const l1 = document.getElementById('loggedMedsList'), l2 = document.getElementById('loggedHartList');
        l1.innerHTML = ""; meds.forEach((m, i) => l1.innerHTML += `<li>${m} <span class="delete-item" onclick="meds.splice(${i},1); render()">✖</span></li>`);
        l2.innerHTML = ""; hart.forEach((h, i) => l2.innerHTML += `<li>${h} <span class="delete-item" onclick="hart.splice(${i},1); render()">✖</span></li>`);
    }
    function resetForm() { if(confirm("Clear form?")) { document.getElementById('epcrForm').reset(); meds = []; hart = []; render(); revealFormAndPopulateMeds(); } }
    function copyInjuryMDT() {
        const xray = (document.getElementById('xraySelect').value === "Yes") ? document.getElementById('xrayResults').value : "No";
        const mri = (document.getElementById('mriSelect').value === "Yes") ? document.getElementById('mriResults').value : "No";
        const scene = (document.getElementById('grade').value.match(/HEMS|Doctor/)) ? `\nSCENE FINDINGS: ${document.getElementById('sceneFindings').value}\n` : "";
        navigator.clipboard.writeText(`*** INJURY REPORT ***\nUNIT: ${document.getElementById('callsign').value}${scene}\nCOMPLAINT: ${document.getElementById('injuryInfo').value}\n\nIMAGING: X-Ray(${xray}) MRI(${mri})`).then(() => alert("Copied!"));
    }
    function copyTreatmentMDT() {
        const rsi = (document.getElementById('rsiSelect').value === "Yes") ? `\n--- RSI ---\nMEDS: ${document.getElementById('rsiMeds').value} @ ${document.getElementById('rsiTime').value}` : "";
        navigator.clipboard.writeText(`*** TREATMENT REPORT ***\nMEDICATIONS:\n${meds.join('\n')}\n${rsi}\n\nNOTES: ${document.getElementById('treatmentNotes').value}`).then(() => alert("Copied!"));
    }
</script>
</body>
</html>

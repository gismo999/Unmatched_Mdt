<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHS ePCR System</title>
    <style>
        :root {
            --bg-color: #f2f5f9; --container-bg: #ffffff; --text-color: #1e1f21; --text-secondary: #5a626b; 
            --accent-color: #0d6efd; --accent-hover: #bde0fe; --border-color: #dfe6e9; --input-bg: #f5f8fa; 
            --success-color: #00b894; --success-hover: #a1f9d9; --danger-color: #dc3545; --warning-color: #e67e22; 
            --radius-section: 30px; --radius-input: 20px; --radius-pill: 50px;
            --space-s: 16px; --space-m: 24px; --space-l: 32px;
        }

        body { font-family: 'Nunito', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: var(--space-m); line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background-color: var(--container-bg); padding: 40px; border-radius: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.03); }
        .header { text-align: center; margin-bottom: var(--space-l); }
        .header-title-main { font-size: 2.2em; font-weight: 800; color: var(--text-color); margin-top: 15px; }
        .header-title-main span { color: white; background-color: var(--accent-color); padding: 2px 10px; border-radius: 5px; margin-right: 5px; }
        
        h2 { color: var(--text-color); margin-bottom: var(--space-s); font-size: 1.3em; font-weight: 700; }
        .form-section { margin-bottom: var(--space-l); padding: 30px; background-color: #ffffff; border-radius: var(--radius-section); box-shadow: 0 8px 24px rgba(13, 110, 253, 0.04); border: 1px solid rgba(0,0,0,0.01); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95em; color: var(--text-secondary); margin-left: 5px; }
        input, select, textarea { width: 100%; padding: 14px 20px; background-color: var(--input-bg); border: 2px solid transparent; color: var(--text-color); border-radius: var(--radius-pill); box-sizing: border-box; font-size: 1em; font-weight: 500; transition: all 0.3s; }
        textarea { border-radius: var(--radius-input); height: 110px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-hover); background-color: #ffffff; }
        
        button.primary-btn { width: 100%; padding: 16px; background-color: var(--accent-color); color: white; border: none; border-radius: var(--radius-pill); font-weight: 700; cursor: pointer; margin-top: var(--space-m); }
        button.success-btn { background-color: var(--success-color); }
        
        .meds-logger { display: none; margin-bottom: var(--space-m); padding: 24px; background-color: #ffffff; border: 2px dashed #bde0fe; border-radius: var(--radius-section); }
        .med-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; }
        .logged-meds-list { list-style-type: none; padding: 0; margin-top: 20px; }
        .logged-meds-list li { display: flex; justify-content: space-between; padding: 12px 20px; background-color: var(--input-bg); margin-bottom: 8px; border-radius: var(--radius-input); font-family: monospace; font-weight: bold; }
        .delete-med { color: var(--danger-color); cursor: pointer; }
        
        #hiddenFields { display: none; }
        .hidden-detail-box { display: none; margin-top: 15px; padding: 20px; background-color: #f8f9fa; border-radius: var(--radius-input); }
        .hems-doc-only, .hart-only { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 20px;"><img src="uhs.png" alt="UHS Logo" style="max-width: 250px; height: auto;"></div>
    <div class="header">
        <div class="header-title-main"><span>UHS</span>Unmatched Ambulance Service ePCR</div>
        <div class="header-subtitle">UHS Foundation Trust | Dedicated Care Record</div>
    </div>
    
    <form id="epcrForm">
        <div class="form-section" style="text-align: center; box-shadow: none;">
            <label for="grade">Select Medic Grade</label>
            <select id="grade" onchange="revealFormAndPopulateMeds()" style="max-width: 400px; margin: 0 auto;">
                <option value="" disabled selected>-- Select Grade --</option>
                <option value="Student Paramedic">Student Paramedic</option>
                <option value="Paramedic">Paramedic</option>
                <option value="Advanced Paramedic">Advanced Paramedic</option>
                <option value="HEMS">HEMS</option>
                <option value="HART">HART</option>
                <option value="Junior Doctor">Junior Doctor</option>
                <option value="Doctor">Doctor</option>
            </select>
        </div>

        <div id="hiddenFields">
            <div class="form-section">
                <h2>Incident Details</h2>
                <div class="grid-2">
                    <div><label>Unit / Call Sign</label><input type="text" id="callsign"></div>
                    <div><label>Date & Time</label><input type="datetime-local" id="date"></div>
                </div>
                <div class="hems-doc-only" style="margin-top:20px;"><label>Deployment Method</label><select id="deployMethod"><option value="HEMS">HEMS</option><option value="RRV">RRV</option></select></div>
            </div>

            <div class="form-section">
                <h2>1. Injury Information</h2>
                <div class="hems-doc-only" style="margin-bottom:20px;"><label>Scene Findings</label><textarea id="sceneFindings"></textarea></div>
                <label>Primary Injury / Complaint</label><textarea id="injuryInfo"></textarea>
                <div class="grid-2" style="margin-top:20px; padding:20px; background:var(--input-bg); border-radius:var(--radius-section);">
                    <div><label>X-Ray?</label><select id="xraySelect" onchange="toggleHiddenDiv('xraySelect', 'xrayDetails')"><option value="No">No</option><option value="Yes">Yes</option></select><div id="xrayDetails" class="hidden-detail-box"><label>Findings:</label><input type="text" id="xrayResults"></div></div>
                    <div><label>MRI?</label><select id="mriSelect" onchange="toggleHiddenDiv('mriSelect', 'mriDetails')"><option value="No">No</option><option value="Yes">Yes</option></select><div id="mriDetails" class="hidden-detail-box"><label>Findings:</label><input type="text" id="mriResults"></div></div>
                </div>
                <button type="button" class="primary-btn" onclick="copyInjuryMDT()">📋 Copy INJURY Section</button>
            </div>

            <div class="form-section">
                <h2>2. Treatment & Medications</h2>
                <label style="display:flex; align-items:center; gap:10px;"><input type="checkbox" id="medsToggle" onchange="toggleMedsUI()" style="width:20px;"> Medication Administered?</label>
                <div id="medsLoggerUI" class="meds-logger">
                    <div class="med-row">
                        <div><label>Medication</label><select id="medSelect"></select></div>
                        <div><label>Dosage</label><input type="text" id="medDose" placeholder="e.g. 5mg"></div>
                        <div><label>Time</label><input type="time" id="medTime"></div>
                        <button type="button" class="add-med-btn" onclick="logMedication()">Add</button>
                    </div>
                    <ul id="loggedMedsList" class="logged-meds-list"></ul>
                </div>
                <label>Treatment Notes</label><textarea id="treatmentNotes"></textarea>
                <button type="button" class="primary-btn success-btn" onclick="copyTreatmentMDT()">📋 Copy TREATMENT Section</button>
            </div>
        </div>
    </form>
</div>

<script>
    const medMap = { "Student Paramedic": ["Oxygen (GAS)", "Aspirin 300mg (TABLET)", "Codeine 15mg (TABLET)", "Glucose 50g/500ml", "GTN 400mcg/spray", "Ibuprofen 400mg", "Ipratropium Bromide", "Naproxen 250mg", "Paracetamol 1g", "Salbutamol 2.5mg/2.5ml"], "Paramedic": ["Adrenaline 1mg/10ml", "Amiodarone 300mg/10ml", "Atropine Sulfate 600mcg", "Chlorphenamine 10mg/1ml", "Metoclopramide 10mg/2ml", "Midazolam 5mg/5ml", "Morphine Sulfate 10mg/1ml", "Naloxone 400mcg/1ml", "TXA 100mg/1ml"], "Advanced Paramedic": ["Ketamine 10mg/1ml"], "HEMS": ["Amoxicillin 500mg", "Rocuronium Bromide 10mg/1ml"], "Doctor": ["Co-amoxiclav 1200mg", "Diazepam 5mg"] };
    let meds = [];

    function revealFormAndPopulateMeds() {
        const g = document.getElementById('grade').value;
        document.getElementById('hiddenFields').style.display = "block";
        const medSelect = document.getElementById('medSelect'); medSelect.innerHTML = "";
        Object.keys(medMap).forEach(k => { if(g.includes(k)) medMap[k].forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; medSelect.appendChild(o); }); });
    }
    function toggleHiddenDiv(s, d) { document.getElementById(d).style.display = (document.getElementById(s).value === "Yes") ? "block" : "none"; }
    function toggleMedsUI() { document.getElementById('medsLoggerUI').style.display = document.getElementById('medsToggle').checked ? "block" : "none"; }
    function logMedication() { meds.push(`[${document.getElementById('medTime').value}] ${document.getElementById('medSelect').value} (${document.getElementById('medDose').value})`); renderList(); }
    function renderList() { const l = document.getElementById('loggedMedsList'); l.innerHTML = ""; meds.forEach((m, i) => l.innerHTML += `<li>${m} <span class="delete-med" onclick="meds.splice(${i},1); renderList()">✖</span></li>`); }

    function copyInjuryMDT() {
        const xray = (document.getElementById('xraySelect').value === "Yes") ? document.getElementById('xrayResults').value : "No";
        const mri = (document.getElementById('mriSelect').value === "Yes") ? document.getElementById('mriResults').value : "No";
        const out = `*** ePCR: INJURY REPORT ***\nUNIT: ${document.getElementById('callsign').value} | DATE: ${document.getElementById('date').value}\n\nPRIMARY COMPLAINT:\n${document.getElementById('injuryInfo').value}\n\nX-RAY: ${xray}\nMRI: ${mri}`;
        navigator.clipboard.writeText(out).then(() => alert("Injury section copied!"));
    }

    function copyTreatmentMDT() {
        const out = `*** ePCR: TREATMENT REPORT ***\nMEDICATIONS:\n${meds.join('\n')}\n\nNOTES:\n${document.getElementById('treatmentNotes').value}`;
        navigator.clipboard.writeText(out).then(() => alert("Treatment section copied!"));
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleplay ePCR System</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
            --border-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1, h2 {
            text-align: center;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .form-section {
            margin-bottom: 25px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        
        /* Smooth reveal for the hidden section */
        #hiddenFields {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Patient Care Record</h1>
    
    <form id="epcrForm">
        <!-- MEDIC GRADE (Always visible) -->
        <div class="form-section">
            <label for="grade" style="font-size: 1.1em; text-align: center; margin-bottom: 10px;">Select Medic Grade to Begin</label>
            <select id="grade" onchange="revealForm()" style="font-size: 1.1em; padding: 12px;">
                <option value="" disabled selected>-- Select Grade --</option>
                <option value="Student Paramedic">Student Paramedic</option>
                <option value="Paramedic">Paramedic</option>
                <option value="Advanced Paramedic">Advanced Paramedic</option>
                <option value="HEMS">HEMS</option>
                <option value="HART">HART</option>
                <option value="Junior Doctor">Junior Doctor</option>
                <option value="Doctor">Doctor</option>
            </select>
        </div>

        <!-- HIDDEN FIELDS (Revealed after grade selection) -->
        <div id="hiddenFields">
            
            <div class="form-section">
                <h2>Incident & Patient Details</h2>
                <div class="grid-2">
                    <div>
                        <label for="callsign">Unit / Call Sign</label>
                        <input type="text" id="callsign" placeholder="e.g. Medic 1">
                    </div>
                    <div>
                        <label for="date">Date & Time</label>
                        <input type="datetime-local" id="date">
                    </div>
                </div>

                <div class="grid-2" style="margin-top: 15px;">
                    <div>
                        <label for="firstName">Patient First Name</label>
                        <input type="text" id="firstName" placeholder="First Name">
                    </div>
                    <div>
                        <label for="surname">Patient Surname</label>
                        <input type="text" id="surname" placeholder="Surname">
                    </div>
                </div>

                <div style="margin-top: 15px;">
                    <label for="attendance">Attendance Method</label>
                    <select id="attendance">
                        <option value="Attended Scene" selected>Attended Scene (Responded to Emergency)</option>
                        <option value="Self Presented">Self Presented (Walk-in / Brought in)</option>
                    </select>
                </div>
            </div>

            <!-- NARRATIVE & TREATMENT -->
            <div class="form-section">
                <h2>Narrative & Treatment</h2>
                <label for="treatment">Treatments / Interventions Provided</label>
                <textarea id="treatment" placeholder="Details of care provided..."></textarea>
                
                <label for="narrative" style="margin-top: 15px;">Narrative / Incident Summary</label>
                <textarea id="narrative" placeholder="Detailed account of the incident..."></textarea>
            </div>

            <button type="button" onclick="generateAndCopy()">Generate MDT Text & Copy to Clipboard</button>
        </div>
    </form>
</div>

<script>
    // Function to reveal the rest of the form when a grade is selected
    function revealForm() {
        const grade = document.getElementById('grade').value;
        const hiddenSection = document.getElementById('hiddenFields');
        
        if (grade !== "") {
            hiddenSection.style.display = "block";
        }
    }

    // Function to compile the text and copy to clipboard
    function generateAndCopy() {
        const grade = document.getElementById('grade').value;
        const callsign = document.getElementById('callsign').value || 'N/A';
        const date = document.getElementById('date').value || 'N/A';
        const firstName = document.getElementById('firstName').value || 'Unknown';
        const surname = document.getElementById('surname').value || 'Unknown';
        const attendance = document.getElementById('attendance').value;
        const treatment = document.getElementById('treatment').value || 'None';
        const narrative = document.getElementById('narrative').value || 'No narrative provided.';

        // Format the text specifically for MDT pasting
        const mdtFormat = `*** ELECTRONIC PATIENT CARE RECORD ***
UNIT: ${callsign} | GRADE: ${grade} | DATE: ${date}

--- INCIDENT INFO ---
ATTENDANCE: ${attendance}
PATIENT NAME: ${firstName} ${surname}

--- INTERVENTIONS ---
${treatment}

--- NARRATIVE ---
${narrative}
**************************************`;

        // Copy to clipboard
        navigator.clipboard.writeText(mdtFormat).then(() => {
            alert("ePCR Data copied to clipboard! You can now paste it into the Qbox MDT.");
        }).catch(err => {
            alert("Failed to copy text. Your browser might block clipboard access.");
            console.error(err);
        });
    }
</script>

</body>
</html>
